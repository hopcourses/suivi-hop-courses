<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de commande - HOP Courses</title>
    
    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 100%; margin: 0 auto; background: #ffffff; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        h3 { color: #003366; border-bottom: 2px solid #ff9100; padding-bottom: 8px; margin-top: 0; font-size: 18px; }
        
        .status-box { background-color: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #ff9100; margin: 15px 0; }
        
        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 10px; margin: 15px 0; overflow: hidden; height: 10px; }
        .progress-bar { height: 100%; width: 0%; background-color: #ff9100; border-radius: 10px; transition: width 1s ease-in-out; }
        
        .progress-labels { font-size: 10px; color: #666; display: flex; justify-content: space-between; margin-bottom: 5px; text-align: center; }
        .progress-labels span { flex: 1; }

        #map { height: 220px; width: 100%; border-radius: 6px; margin: 15px 0; border: 1px solid #ddd; }
        
        .admin-box { background-color: #fff8f0; border: 1px solid #ff9100; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; display: none; }
        
        .footer { margin-top: 15px; font-size: 13px; color: #666; text-align: center; }

        /* Animation de pulsation pour le point de collecte */
        @keyframes pulse-orange-ring {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 145, 0, 0.7); }
            70% { transform: scale(1.3); box-shadow: 0 0 0 10px rgba(255, 145, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 145, 0, 0); }
        }
        .collecte-pulse {
            background-color: #ff9100; 
            width: 14px; 
            height: 14px; 
            border-radius: 50%; 
            border: 2px solid white; 
            animation: pulse-orange-ring 1.2s infinite;
        }

        .collecte-normal {
            background-color: #ff9100; 
            width: 14px; 
            height: 14px; 
            border-radius: 50%; 
            border: 2px solid white; 
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
        }

        /* Encart rectangulaire avec centrage parfait (Flexbox) */
        .driver-badge {
            background-color: rgba(20, 20, 20, 0.9);
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            white-space: nowrap;
            /* La magie du centrage parfait : */
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div class="container">
        <h3 id="page-title">Suivi de votre livraison</h3>
        
        <div id="admin-panel" class="admin-box">
            <strong>Espace Expéditeur / Marchand</strong><br>
            Client : <span id="client-name">Chargement...</span>
        </div>

        <div class="status-box">
            <p style="margin: 0; color: #003366; font-size: 14px;"><strong>Référence :</strong> <span id="order-id">Chargement...</span></p>
            <p style="margin: 6px 0 0 0; color: #003366; font-size: 14px;"><strong>Statut :</strong> <span id="order-status">En cours de traitement</span></p>
            <p style="margin: 6px 0 0 0; color: #003366; font-size: 14px;"><strong>Arrivée prévue avant :</strong> <span id="delivery-time">Calcul en cours...</span></p>
        </div>

        <div>
            <div class="progress-labels">
                <span>Préparation</span>
                <span>Acceptée</span>
                <span>Collecte</span>
                <span>En route</span>
                <span>Livrée</span>
            </div>
            <div class="progress-container">
                <div id="progress" class="progress-bar"></div>
            </div>
        </div>

        <div id="map"></div>

        <div class="footer">
            Une question ? <a href="mailto:contact@hop-courses.com" style="color: #003366; font-weight: bold;">contact@hop-courses.com</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        const status = urlParams.get('status') || 'En préparation';
        const time = urlParams.get('time') || 'Bientôt';
        const role = urlParams.get('role'); 
        const clientName = urlParams.get('client') || 'Client HOP';
        const livreurName = urlParams.get('livreur') || 'Livreur';

        const latA = parseFloat(urlParams.get('latA')) || 50.735;
        const lonA = parseFloat(urlParams.get('lonA')) || 2.745;
        const latB = parseFloat(urlParams.get('latB')) || 50.780;
        const lonB = parseFloat(urlParams.get('lonB')) || 2.820;

        document.getElementById('order-id').innerText = orderId ? "#" + orderId : "Non spécifiée";
        document.getElementById('delivery-time').innerText = time;
        document.getElementById('client-name').innerText = clientName;

        if (role === 'expediteur') {
            document.getElementById('page-title').innerText = "Tableau de bord - Expéditeur";
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            document.getElementById('page-title').innerText = "Suivi de votre livraison HOP Courses";
        }

        const progressBar = document.getElementById('progress');
        const statusText = document.getElementById('order-status');
        
        let isPointAPulsing = false; 
        let isDriverMoving = false;  

        switch(status) {
            case 'En préparation':
            case 'En attente':
                statusText.innerText = "En attente de prise en charge";
                progressBar.style.width = '10%';
                break;
            case 'Acceptée':
                statusText.innerText = `Commande acceptée par ${livreurName}`;
                progressBar.style.width = '30%';
                break;
            case 'En cours de collecte':
                statusText.innerText = `${livreurName} est en route pour le point de collecte`;
                progressBar.style.width = '50%';
                isPointAPulsing = true;
                break;
            case 'Collectée':
                statusText.innerText = `${livreurName} a collecté la commande`;
                progressBar.style.width = '70%';
                isPointAPulsing = true;
                break;
            case 'En route':
                statusText.innerText = `${livreurName} est en route vers l'adresse de livraison`;
                progressBar.style.width = '85%';
                isDriverMoving = true;
                break;
            case 'Livrée':
                statusText.innerText = "Commande livrée avec succès ✅";
                progressBar.style.width = '100%';
                progressBar.style.backgroundColor = '#28a745';
                break;
            default:
                statusText.innerText = status;
                progressBar.style.width = '10%';
        }

        const centerLat = (latA + latB) / 2;
        const centerLon = (lonA + lonB) / 2;
        const map = L.map('map').setView([centerLat, centerLon], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const pointClass = isPointAPulsing ? 'collecte-pulse' : 'collecte-normal';
        const orangeIcon = L.divIcon({
            html: `<div class="${pointClass}"></div>`,
            iconSize: [14, 14],
            className: ''
        });

        const blueIcon = L.divIcon({
            html: '<div style="background-color: #003366; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.4);"></div>',
            iconSize: [14, 14],
            className: ''
        });

        L.marker([latA, lonA], {icon: orangeIcon}).addTo(map).bindPopup("Point de collecte");
        L.marker([latB, lonB], {icon: blueIcon}).addTo(map).bindPopup("Point de livraison");

        const polyline = L.polyline([[latA, lonA], [latB, lonB]], {
            color: '#003366',
            weight: 3,
            dashArray: '5, 10'
        }).addTo(map);

        map.fitBounds(polyline.getBounds(), { padding: [30, 30] });

        // Encart rectangulaire noir avec le prénom uniquement
        if (isDriverMoving) {
            const livreurIcon = L.divIcon({
                html: `<div class="driver-badge">${livreurName}</div>`,
                iconSize: [0, 0],
                className: ''
            });

            const livreurMarker = L.marker([latA, lonA], {icon: livreurIcon}).addTo(map);

            let progress = 0;
            setInterval(() => {
                progress += 0.005; 
                if (progress > 1) {
                    progress = 0; 
                }
                const lat = latA + (latB - latA) * progress;
                const lon = lonA + (lonB - lonA) * progress;
                livreurMarker.setLatLng([lat, lon]);
            }, 50);
        }
    </script>

</body>
</html>
