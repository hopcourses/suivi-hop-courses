            font-size: 11px;
            font-weight: bold;
            border: 2px solid white;

<body>

    <div class="container">
        <h3 id="page-title">Suivi de votre livraison</h3>
        
        <!-- Encart réservé à l'expéditeur -->
        <div id="admin-panel" class="admin-box">
            <strong>Espace Expéditeur / Marchand</strong><br>
            Client : <span id="client-name">Chargement...</span>
        </div>

        <div class="status-box">
            <p style="margin: 0; color: #003366; font-size: 14px;"><strong>Référence :</strong> <span id="order-id">Chargement...</span></p>
            <p style="margin: 6px 0 0 0; color: #003366; font-size: 14px;"><strong>Statut :</strong> <span id="order-status">En cours de traitement</span></p>
            <p style="margin: 6px 0 0 0; color: #003366; font-size: 14px;"><strong>Arrivée prévue avant :</strong> <span id="delivery-time">Calcul en cours...</span></p>
        </div>

        <!-- Barre de progression -->
        <div>
            <div class="progress-labels">
                <span>Préparation</span>
                <span>Acceptée</span>
                <span>Collecte</span>
                <span>En route</span>
                <span>Livrée</span>
            </div>
            <div class="progress-container">
                <div id="progress" class="progress-bar"></div>
            </div>
        </div>

        <!-- Carte Leaflet -->
        <div id="map"></div>

        <div class="footer">
            Une question ? <a href="mailto:contact@hop-courses.com" style="color: #003366; font-weight: bold;">contact@hop-courses.com</a>
        </div>
    </div>

    <!-- Script Leaflet -->
    <script src="[https://unpkg.com/leaflet@1.9.4/dist/leaflet.js](https://unpkg.com/leaflet@1.9.4/dist/leaflet.js)"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        const status = urlParams.get('status') || 'En préparation';
        const time = urlParams.get('time') || 'Bientôt';
        const role = urlParams.get('role'); 
        const clientName = urlParams.get('client') || 'Client HOP';
        const livreurName = urlParams.get('livreur') || 'Le livreur'; // Prénom du livreur

        // GPS par défaut
        const latA = parseFloat(urlParams.get('latA')) || 50.735;
        const lonA = parseFloat(urlParams.get('lonA')) || 2.745;
        const latB = parseFloat(urlParams.get('latB')) || 50.780;
        const lonB = parseFloat(urlParams.get('lonB')) || 2.820;

        // Remplissage des textes
        document.getElementById('order-id').innerText = orderId ? "#" + orderId : "Non spécifiée";
        document.getElementById('delivery-time').innerText = time;
        document.getElementById('client-name').innerText = clientName;

        if (role === 'expediteur') {
            document.getElementById('page-title').innerText = "Tableau de bord - Expéditeur";
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            document.getElementById('page-title').innerText = "Suivi de votre livraison HOP Courses";
        }

        // Gestion de la barre de progression, des textes et de l'état de la carte
        const progressBar = document.getElementById('progress');
        const statusText = document.getElementById('order-status');
        
        let isPointAPulsing = false; // Pour savoir si le point A doit clignoter
        let isDriverMoving = false;  // Pour savoir si on anime le livreur

        switch(status) {
            case 'En préparation':
            case 'En attente':
                statusText.innerText = "En attente de prise en charge";
                progressBar.style.width = '10%';
                break;
            case 'Acceptée':
                statusText.innerText = `Commande acceptée par ${livreurName}`;
                progressBar.style.width = '30%';
                break;
            case 'En cours de collecte':
                statusText.innerText = `${livreurName} est en route pour le point de collecte`;
                progressBar.style.width = '50%';
                isPointAPulsing = true;
                break;
            case 'Collectée':
                statusText.innerText = `${livreurName} a collecté la commande`;
                progressBar.style.width = '70%';
                isPointAPulsing = true;
                break;
            case 'En route':
                statusText.innerText = `${livreurName} est en route vers l'adresse de livraison 🛵`;
                progressBar.style.width = '85%';
                isDriverMoving = true;
                break;
            case 'Livrée':
                statusText.innerText = "Commande livrée avec succès ✅";
                progressBar.style.width = '100%';
                progressBar.style.backgroundColor = '#28a745';
                break;
            default:
                statusText.innerText = status;
                progressBar.style.width = '10%';
        }

        // Initialisation de la carte Leaflet
        const centerLat = (latA + latB) / 2;
        const centerLon = (lonA + lonB) / 2;
        const map = L.map('map').setView([centerLat, centerLon], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Application du style du point A selon le statut (clignotant ou normal)
        const pointAClass = isPointAPulsing ? 'marker-pulse' : 'marker-normal-orange';
        const orangeIcon = L.divIcon({
            html: `<div class="${pointAClass}"></div>`,
            iconSize: [14, 14],
            className: '' // Désactive les styles par défaut de leaflet pour cette div
        });

        const blueIcon = L.divIcon({
            html: '<div style="background-color: #003366; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.4);"></div>',
            iconSize: [14, 14]
        });

        L.marker([latA, lonA], {icon: orangeIcon}).addTo(map).bindPopup("Point de collecte");
        L.marker([latB, lonB], {icon: blueIcon}).addTo(map).bindPopup("Point de livraison");

        const polyline = L.polyline([[latA, lonA], [latB, lonB]], {
            color: '#003366',
            weight: 3,
            dashArray: '5, 10'
        }).addTo(map);

        map.fitBounds(polyline.getBounds(), { padding: [30, 30] });

        // Animation en boucle du livreur avec son prénom si "En route"
        if (isDriverMoving) {
            const livreurIcon = L.divIcon({
                html: `<div class="driver-label">🛵 ${livreurName}</div>`,
                iconSize: [0, 0], // La taille est gérée par le CSS interne
                className: ''
            });

            const livreurMarker = L.marker([latA, lonA], {icon: livreurIcon}).addTo(map);

            let progress = 0;
            setInterval(() => {
                progress += 0.005; // Vitesse de déplacement
                if (progress > 1) {
                    progress = 0; // Reviens au point A pour boucler
                }
                const lat = latA + (latB - latA) * progress;
                const lon = lonA + (lonB - lonA) * progress;
                livreurMarker.setLatLng([lat, lon]);
            }, 50);
        }
    </script>
